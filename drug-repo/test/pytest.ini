[pytest]
# Register custom marks used in test_api_server.py
markers =
    utility:    Utility endpoint tests (health, stats)
    query:      Read / GET endpoint tests
    search:     Search endpoint tests
    mutation:   Write endpoint tests (POST, PUT, DELETE)
    validation: Input validation / 4xx error tests
    not_found:  404 path tests
    edge:       Edge cases and integration scenarios
