<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMS Admin Version Review</title>
    <link rel="stylesheet" href="./styles.css?v=20260405-admin-ui-fixes-12" />
</head>
<body>
    <div class="admin-app">
        <section class="shell review-shell" id="reviewShell">
            <header class="shell-header">
                <div>
                    <p class="eyebrow">DoseFinder Admin</p>
                    <h1>Version review</h1>
                </div>
                <div class="review-header__actions">
                    <a href="./index.html" class="ghost-button review-back-link">Back to dashboard</a>
                    <div class="shell-user">
                        <div>
                            <span class="shell-user__label">Signed in as</span>
                            <strong id="currentAdminName">admin</strong>
                        </div>
                        <button id="logoutButton" type="button" class="ghost-button">Logout</button>
                    </div>
                </div>
            </header>

            <div id="statusBanner" class="status-banner hidden" role="status" aria-live="polite"></div>

            <main class="review-layout">
                <section class="panel panel--wide">
                    <div class="panel-header panel-header--review">
                        <div>
                            <p class="panel-eyebrow">Version reviewer</p>
                            <h2 id="reviewTitle">Loading review...</h2>
                        </div>
                        <div class="review-summary-wrap">
                            <div id="reviewSummary" class="review-summary">Checking the requested drug version.</div>
                            <button id="toggleRawJsonButton" type="button" class="ghost-button review-toggle hidden">Show raw JSON</button>
                        </div>
                    </div>
                    <div id="reviewMeta" class="panel-subtle">
                        Loading the requested version snapshot.
                    </div>
                    <div id="reviewContent" class="inspector-content"></div>
                </section>
            </main>
        </section>
    </div>

    <script src="./review.js?v=20260421-admin-api-proxy"></script>
</body>
</html>
